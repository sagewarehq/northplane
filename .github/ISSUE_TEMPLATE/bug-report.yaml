name: Bug Report
description: Report an issue with Northplane
assignees: [tale]
labels: ["Bug", "Needs Triage"]
body:
  - type: textarea
    attributes:
      label: Description
      description: |
        A detailed description of the issue and steps to reproduce it.
        If applicable, include any error messages or screenshots.

        If this is not an issue with Northplane, but an issue with your
        environment, please consider opening a discussion instead.
      placeholder: e.g. "When I try to upload a file, I get an error message."
    validations:
      required: true
  - type: input
    attributes:
      label: Northplane Version
      description: What version of Northplane are you using?
      placeholder: e.g. "v0.6.2"
    validations:
      required: true
  - type: input
    attributes:
      label: Headscale Version
      description: What version of Headscale are you using?
      placeholder: e.g. "v0.27.1"
    validations:
      required: true
